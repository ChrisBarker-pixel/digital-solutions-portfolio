<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial Black', sans-serif;
        }

        .design-container {
            position: relative;
            width: 600px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Water Splash & Fall Graphic */
        .water-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: drop-shadow(0 0 20px rgba(79, 172, 254, 0.5));
        }

        /* The Professional Badge */
        .badge {
            width: 380px;
            height: 380px;
            background: #0d0d1a;
            border-radius: 50%;
            border: 12px solid #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 15px 45px rgba(0,0,0,0.9);
        }

        .brand-top { color: white; font-size: 38px; margin-bottom: 5px; letter-spacing: 2px; }

        .brand-main {
            background: #00f2fe;
            color: #001f3f;
            font-size: 48px;
            padding: 2px 25px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .divider { width: 60%; height: 3px; background: #ffffff; margin-bottom: 12px; }

        .location { color: #ffffff; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }

        .corridor {
            color: #FFD700;
            font-size: 11px;
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="design-container">
    <svg class="water-layer" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#00f2fe;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#a8c0ff;stop-opacity:0.8" />
            </linearGradient>
        </defs>

        <path fill="url(#liquidGrad)" d="M200,50 C110,50 40,120 40,210 C40,300 110,370 200,370 C220,370 240,365 255,355 C270,400 240,480 200,500 C210,480 230,420 220,370 C310,360 360,280 360,210 C360,120 290,50 200,50 Z" />

        <circle fill="white" cx="80" cy="120" r="4" opacity="0.4" />
        <circle fill="white" cx="320" cy="150" r="6" opacity="0.3" />
        <circle fill="#ffffff" cx="210" cy="450" r="3" opacity="0.5" />

        <circle fill="#00f2fe" cx="50" cy="280" r="8" />
        <circle fill="#4facfe" cx="340" cy="300" r="5" />
        <circle fill="#00f2fe" cx="240" cy="480" r="4" />
    </svg>

    <div class="badge">
        <div class="brand-top">STAR WASH</div>
        <div class="brand-main">EXPRESS</div>
        <div class="divider"></div>
        <div class="location">Grass Valley // Nevada City</div>
        <div class="corridor">Roseville - Marysville Corridor</div>
    </div>
</div>

</body>
</html>
