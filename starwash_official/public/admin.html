<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARWASH // Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #39FF14; font-family: monospace; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid #39FF14; }
        .secure-hide { display: none; }
    </style>
</head>
<body class="p-4">

    <!-- NODE AUTHENTICATION OVERLAY -->
    <div id="securityOverlay" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-8">
        <div class="text-center">
            <h2 class="text-[#39FF14] text-xs tracking-[0.5em] uppercase mb-4 animate-pulse">Node Authentication Required</h2>
            <input type="password" id="nodePass" placeholder="ENTER ACCESS KEY"
                   class="bg-black border border-[#39FF14] p-4 text-center text-[#39FF14] outline-none mb-4 w-full">
            <button onclick="checkAuth()" class="block w-full bg-[#39FF14] text-black py-2 font-bold uppercase text-[10px]">Verify Node</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainDashboard" class="secure-hide">
        <header class="mb-8 border-b border-[#39FF14] pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-black italic uppercase">Active Inlet Stream</h1>
                <p class="text-[10px] text-cyan-400 font-bold uppercase">Zenith Node Official Admin</p>
            </div>
            <button onclick="location.reload()" class="text-[8px] border border-gray-700 px-2 py-1 text-gray-500 uppercase">Lock Node</button>
        </header>

        <div id="bookingList" class="grid gap-4">
            <div class="p-8 text-center text-gray-500 uppercase text-xs">Scanning for signals...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- AUTH LOGIC ---
        window.checkAuth = () => {
            const pass = document.getElementById('nodePass').value;
            if (pass === "STARWASH2026") {
                document.getElementById('securityOverlay').remove();
                document.getElementById('mainDashboard').classList.remove('secure-hide');
            } else {
                alert("NODE ERROR: UNAUTHORIZED");
            }
        };

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyC2FvmW6sGbTq195BVc0OGNtXzZrZ77PDw",
            authDomain: "zenith-hub-2026-official.firebaseapp.com",
            projectId: "zenith-hub-2026-official",
            storageBucket: "zenith-hub-2026-official.firebasestorage.app",
            messagingSenderId: "34818193234",
            appId: "1:34818193234:web:zenith"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- THE ENGINE ---
        // Simplified query to avoid index requirements
        const q = query(collection(db, "starwash_bookings"));

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('bookingList');
            list.innerHTML = '';

            snapshot.forEach((bookingDoc) => {
                const b = bookingDoc.data();
                const id = bookingDoc.id;

                // YOUR LIVE STRIPE LINKS
                const stripeLinks = {
                    'OUTSIDE_ONLY': 'https://buy.stripe.com/bJe28q67T9rCgBq7krefC05',
                    'INSIDE_ONLY': 'https://buy.stripe.com/bJe9AS1RDcDO3OEgV1efC04',
                    'FULL_DETAIL': 'https://buy.stripe.com/00w4gy9k55bm3OE34befC02',
                    'GLASS_CERAMIC': 'https://buy.stripe.com/3cIfZg67T47ifxm5cjefC01'
                };

                const currentStripeLink = stripeLinks[b.package] || 'https://buy.stripe.com/GENERAL';
                const statusColor = b.status === 'completed' ? 'text-gray-600' : 'text-cyan-400 animate-pulse';

                // Build the card UI
                list.innerHTML += `
                    <div class="card p-6 rounded-xl mb-2 border-[#39FF14]/30 bg-black/40">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-white font-bold uppercase text-lg leading-tight">${b.customerName || 'Unknown Customer'}</h3>
                                <p class="text-[10px] text-gray-500 tracking-widest">${b.customerPhone || 'No Phone'}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-[9px] font-black ${statusColor} border border-current px-2 py-0.5 rounded">
                                    ${(b.status || 'pending').toUpperCase()}
                                </span>
                            </div>
                        </div>

                        <!-- STRIPE QR ZONE -->
                        <div id="stripe-zone-${id}" class="hidden mb-6 p-4 bg-white rounded-lg flex flex-col items-center">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${currentStripeLink}" class="mb-3">
                            <p class="text-black text-[10px] font-black uppercase text-center">
                                SCAN FOR ${b.package}<br>
                                <span class="text-blue-600">AMOUNT: $${b.priceLocked || '0.00'}</span>
                            </p>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <button onclick="document.getElementById('stripe-zone-${id}').classList.toggle('hidden')"
                                class="border border-cyan-400 text-cyan-400 py-3 text-[10px] font-black uppercase tracking-tighter hover:bg-cyan-400 hover:text-black transition-all">
                                Show Stripe QR
                            </button>

                            <button onclick="completeJob('${id}')"
                                class="bg-[#39FF14] text-black py-3 text-[10px] font-black uppercase tracking-tighter hover:bg-white transition-all">
                                Close & Payout
                            </button>
                        </div>

                        <div class="flex justify-between items-center text-[9px] text-gray-600 uppercase font-mono italic">
                            <span>${b.vehicle || 'No Vehicle Info'}</span>
                            <span>${b.appointmentDate || 'No Date'}</span>
                        </div>
                    </div>
                `;
            });
        });

        // --- ACTION: COMPLETE JOB ---
        window.completeJob = async (id) => {
            if(confirm("Confirm Wash Completion? Ledger will update and status will change to COMPLETED.")) {
                try {
                    await updateDoc(doc(db, "starwash_bookings", id), {
                        status: 'completed'
                    });
                } catch (e) {
                    alert("Error updating status: " + e.message);
                }
            }
        };
    </script>
</body>
</html>
